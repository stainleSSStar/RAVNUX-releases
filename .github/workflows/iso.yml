name: Build RAVNUX ISO
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/PROGRESS.md', 'docs/artwork-prompts.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: Build the ISO (stage 5)
        type: boolean
        default: true
      vm_tests:
        description: Also boot BIOS and UEFI VMs (stages 6a/6b)
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ravnux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          python3 scripts/check.py
          sudo python3 -m unittest discover -s tests -v
      - name: Prepare profile using packaged Archiso templates
        run: |
          docker run --rm \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/build" -w /build archlinux:base-devel \
            bash -euc 'pacman -Syu --noconfirm archiso python; bash scripts/build.sh --prepare-only'
  iso:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build in official Arch Linux container
        id: build
        run: |
          mkdir -p ci-logs
          docker run --rm --privileged \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/build" -w /build archlinux:base-devel \
            bash -euc 'pacman -Syu --noconfirm archiso python; bash scripts/build.sh' 2>&1 | tee ci-logs/build.log
      - name: Make output writable for VM logs
        if: always() && steps.build.outcome != 'skipped'
        run: |
          if [ -d out ]; then sudo chown -R "$(id -u):$(id -g)" out; fi
      - name: Boot ISO in BIOS and UEFI virtual machines
        id: vm
        if: inputs.vm_tests && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          python3 scripts/vm-smoke.py --timeout 1800 out/*.iso 2>&1 | tee ci-logs/vm.log
      - name: Upload ISO, checksums and package manifests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RAVNUX-x86_64-${{ github.run_number }}
          path: |
            out/
            ci-logs/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Publish ISO to the public releases repository
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: stainleSSStar/RAVNUX-releases
        run: |
          set -euo pipefail
          shopt -s nullglob
          iso_version="$(date -u --date="@$(sed -n 's/^SOURCE_DATE_EPOCH=//p' out/build-info.txt)" +%Y.%m.%d)"
          tag="v${iso_version}-r${GITHUB_RUN_NUMBER}"
          notes="RAVNUX live/installer ISO built from commit ${GITHUB_SHA} (workflow run ${GITHUB_RUN_NUMBER}).
          Release assets: ISO image, SHA256SUMS, package manifests, build/VM logs.
          VM boot tests: ${{ steps.vm.outcome == 'success' && 'passed (BIOS and UEFI)' || 'not passed; see logs' }}."
          publish=(--prerelease)
          if [[ '${{ inputs.vm_tests }}' == true && '${{ steps.vm.outcome }}' == success ]]; then
            publish=(--latest)
          fi
          assets=(out/*.iso out/SHA256SUMS out/*.txt out/vm-*.log ci-logs/*.log)
          gh release create "$tag" --repo "$RELEASE_REPO" \
            --title "RAVNUX ${iso_version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$notes" \
            "${publish[@]}" "${assets[@]}"
